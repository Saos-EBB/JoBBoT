; Modell-Presets für llama-server im Router-Modus (scripts/llama-server.sh).
; Der Abschnittsname ist der Modellname, den der Bot schickt (JOBBOT_LLAMACPP_MODEL,
; Bench: --models=…). Schlüssel = llama-server-Argumente ohne "--".
; {{MODELS_DIR}} ersetzt das Startskript (Default ~/.local/share/llama-models).
version = 1

[*]
; Kontext reicht für Prompt (~1.2k Tokens) + Brief; np=1, sonst teilt der Server den
; Kontext auf parallele Slots auf. t=8 = physische Kerne des Ryzen 7 5850U.
c = 4096
np = 1
t = 8
jinja = true

; Gemma 4 26B-A4B (MoE, ~4B aktiv), Googles QAT-Q4_0 — Vulkan auf der Vega-iGPU
[gemma4-26b]
model = {{MODELS_DIR}}/gemma-4-26B_q4_0-it.gguf
ngl = 99

; dasselbe Modell, reine CPU (device=none schaltet auch das Op-Offload ab)
[gemma4-26b-cpu]
model = {{MODELS_DIR}}/gemma-4-26B_q4_0-it.gguf
device = none
ngl = 0

; Mistral Small 3.2 24B (dense), Q4_K_M — Baseline (früheres Anschreiben-Modell)
[mistral-small3.2]
model = {{MODELS_DIR}}/Mistral-Small-3.2-24B-Instruct-2506-Q4_K_M.gguf
ngl = 99

[mistral-small3.2-cpu]
model = {{MODELS_DIR}}/Mistral-Small-3.2-24B-Instruct-2506-Q4_K_M.gguf
device = none
ngl = 0

; Mini-Modell zum Verdrahten/Smoke-Testen (0.6B, Sekunden statt Minuten)
[qwen3-0.6b]
model = {{MODELS_DIR}}/Qwen3-0.6B-Q4_0.gguf
ngl = 0
device = none

; Bespoke Nimble 9B (Qwen3.5-9B-Finetune), Q8_0 aus der Ollama-Registry (Download: howToUse.md,
; Abschnitt 3) — Klassifizierer für JEV: Schema mit Ein-Buchstaben-Codes rein, ein Buchstabe
; raus. Der System-Prompt steht in lib/nimble-client.ts.
[nimble-9b]
model = {{MODELS_DIR}}/Bespoke-Nimble-9B-Q8_0.gguf
c = 8192
device = none
ngl = 0
; Hybrid-Modell (rekurrente Schichten): Präfix-Cache geht nur über Kontext-Checkpoints.
; Default-Abstand 8192 Tokens heißt bei ~500-Token-Prompts "nie" — dann rechnet jedes
; Feld (lib/filter-nimble.ts) den ganzen Job-Text neu.
checkpoint-min-step = 0
batch-size = 32
ubatch-size = 32

; dasselbe Modell auf der Vega-iGPU (Vulkan) — Prompt-Verarbeitung ist beim Filter der Engpass
[nimble-9b-vulkan]
model = {{MODELS_DIR}}/Bespoke-Nimble-9B-Q8_0.gguf
c = 8192
ngl = 99
checkpoint-min-step = 0
batch-size = 32
ubatch-size = 32
